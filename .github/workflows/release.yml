name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Ensure LICENSE in addon folder
        run: cp LICENSE addons/nexus_importer/LICENSE

      - name: Create ZIP
        run: zip -r nexus_importer-${{ steps.version.outputs.VERSION }}.zip addons

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus_importer-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
