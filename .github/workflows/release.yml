name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Match exact version ## [X.Y.Z] - $2 avoids regex bracket issues
          awk -v ver="$VERSION" '
            $1 == "##" && $2 == "[" ver "]" { found=1; next }
            found && $1 == "##" && $2 ~ /^\[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "See CHANGELOG.md" > release_notes.md

      - name: Ensure LICENSE in addon folder
        run: cp LICENSE addons/nexus_importer/LICENSE

      - name: Create ZIP
        run: zip -r nexus_importer-${{ steps.version.outputs.VERSION }}.zip addons

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: nexus_importer-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
